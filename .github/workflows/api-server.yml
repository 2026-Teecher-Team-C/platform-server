name: api-server

on:
  pull_request:
    paths: ["api-server/**", "proto/**", ".github/workflows/api-server.yml"]
  push:
    branches: [develop, main]
    paths: ["api-server/**", "proto/**", ".github/workflows/api-server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Testcontainers가 러너의 Docker로 PostgreSQL을 띄운다
      - run: ./gradlew test
