name: deploy

# EC2에 SSH로 접속해 직접 빌드·기동한다 (레지스트리 없음 — 배포 아키텍처 문서 4장).
# 재기동 동안 모든 에이전트가 다운로드를 차단한다 (fail-close). 데모 직전 배포 금지.
# 필요한 Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY, EC2_APP_DIR
on:
  push:
    branches: [develop]
    paths:
      - "api-server/**"
      - "detection-engine/**"
      - "proto/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH 키 준비
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: EC2에서 빌드·기동
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'EOF'
            set -e
            cd '${{ secrets.EC2_APP_DIR }}'
            git fetch origin develop && git checkout develop && git reset --hard origin/develop
            C="docker compose --env-file infra/.env -f infra/compose.yml -f infra/compose.temp-db.yml -f infra/compose.prod.yml"
            $C up -d --build < /dev/null
            ok=0
            i=0
            # 기동 때 Flyway가 큰 표를 다시 쓰면(V18: file_fingerprints 117만 행, 로컬 34초) JVM 기동(~30초)과 합쳐 60초를 넘는다.
            deadline=$((SECONDS + 300))
            while [ "$SECONDS" -lt "$deadline" ]; do
              i=$((i + 1))
              if $C exec -T api-server curl -sf --connect-timeout 2 --max-time 3 http://localhost:8080/actuator/health < /dev/null | grep -q '"status":"UP"'; then
                ok=1
                echo "헬스체크 통과: ${i}번째 시도"
                break
              fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              echo "헬스 체크 실패: api-server가 300초 안에 UP 응답을 하지 않았습니다."
              $C ps < /dev/null || true
              $C logs --tail 30 api-server < /dev/null || true
              exit 1
            fi
            # 배포마다 --build 중간 산출물이 쌓여 디스크(19GB)를 채운다(2026-11-16 빌드 캐시 8.2GB, 사용률 77%).
            # 최근 3일 캐시만 남겨 다음 빌드 속도는 유지하고, 태그 없는 옛 이미지도 지운다. 실패해도 배포는 성공으로 둔다.
            docker builder prune -f --filter until=72h < /dev/null || true
            docker image prune -f < /dev/null || true
            df -h / < /dev/null || true
          EOF
