name: deploy

# EC2에 SSH로 접속해 직접 빌드·기동한다 (레지스트리 없음 — 배포 아키텍처 문서 4장).
# 재기동 동안 모든 에이전트가 다운로드를 차단한다 (fail-close). 데모 직전 배포 금지.
# 필요한 Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY, EC2_APP_DIR
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH 키 준비
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: EC2에서 빌드·기동
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'EOF'
            set -e
            cd '${{ secrets.EC2_APP_DIR }}'
            git fetch origin develop && git checkout develop && git reset --hard origin/develop
            C="docker compose --env-file infra/.env -f infra/compose.yml -f infra/compose.temp-db.yml -f infra/compose.prod.yml"
            $C up -d --build < /dev/null
            ok=0
            for i in $(seq 1 30); do
              if $C exec -T api-server curl -sf http://localhost:8080/actuator/health < /dev/null | grep -q '"status":"UP"'; then
                ok=1
                echo "헬스체크 통과: ${i}번째 시도"
                break
              fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              echo "헬스 체크 실패: api-server가 약 60초(30회 x 2초) 안에 UP 응답을 하지 않았습니다."
              $C ps < /dev/null || true
              $C logs --tail 30 api-server < /dev/null || true
              exit 1
            fi
          EOF
