# 운영(EC2)의 임시 DB. RDS로 옮기기 전까지 Postgres를 같은 EC2 컨테이너로 띄운다.
# 2026-11-16까지 EC2에만 있던 파일이다. 비밀번호는 값 대신 infra/.env의 DB_PASSWORD를 쓴다
# (POSTGRES_PASSWORD는 데이터 디렉터리를 처음 만들 때만 쓰여서, 이미 초기화된 운영 DB에는 영향이 없다).
services:
  postgres:
    image: postgres:17-alpine
    # 쿼리별 실행 통계(pg_stat_statements). 고도화 측정용, 2026-11-17.
    # 확장 객체는 최초 1회 수동 생성: CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    # 병렬 쿼리 작업자는 /dev/shm에 동적 공유 메모리를 잡는다. Docker 기본값(64MB)에서는 대시보드를 관리자 5명이
    # 동시에 보자 "could not resize shared memory segment ... No space left on device"로 쿼리가 실패했다
    # (PC 3천 대 측정, 120번 중 15번, 2026-11-28). 상한일 뿐 미리 잡아 두는 메모리는 아니다.
    shm_size: 256m
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 2s
      timeout: 3s
      retries: 30
  api-server:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
