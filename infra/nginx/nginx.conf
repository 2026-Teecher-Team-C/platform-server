events {}

http {
    upstream api_rest { server api-server:8080; }
    upstream api_grpc { server api-server:9090; }

    server {
        # TLS는 EC2 배포 시 Let's Encrypt로 붙인다. 로컬은 평문 HTTP/2(h2c).
        listen 80;
        http2 on;

        # 에이전트 gRPC. 응답 보류 중 판정이 늦어도 먼저 끊지 않도록 타임아웃을 늘린다.
        location /teecher.verdict.v1.VerdictService/ {
            client_max_body_size 512m;
            grpc_read_timeout 300s;
            grpc_send_timeout 300s;
            grpc_pass grpc://api_grpc;
        }

        # 콘솔 REST + SSE. SSE가 버퍼에 쌓이지 않도록 버퍼링을 끈다.
        location /api/ {
            proxy_pass http://api_rest;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        # 탐지 엔진은 nginx에서 닿지 않는다 (engine-net에만 있음).
    }
}
