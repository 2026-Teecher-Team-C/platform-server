# 운영(EC2) nginx. compose.prod.yml이 nginx.conf 자리에 끼운다. location은 locations.conf를 함께 쓴다.
# 연결 한도. 기본값(worker당 512)은 클라이언트 연결과 api-server로 가는 upstream 연결(요청마다 1개)을 함께 센다.
# 넘으면 nginx가 "worker_connections are not enough, reusing connections"([warn])를 남기고 쉬는 연결을 끊는다.
# 동시 업로드 300건(make loadtest-burst)에서 미리 열어 둔 에이전트 연결이 이렇게 끊겼다.
events {
    worker_connections 4096;
}

http {
    upstream api_rest { server api-server:8080; }
    upstream api_grpc { server api-server:9090; }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        # 인증서는 EC2의 Let's Encrypt(certbot)가 갱신한다. compose.prod.yml이 /etc/letsencrypt를 읽기 전용으로 붙인다.
        listen 443 ssl;
        http2 on;
        server_name teamc-platform.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/teamc-platform.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/teamc-platform.duckdns.org/privkey.pem;

        include /etc/nginx/locations.conf;
    }
}
