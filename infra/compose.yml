# 운영(EC2)과 같은 구성. RDS·ElastiCache는 관리형이라 여기 없다 — 로컬에서는 compose.dev.yml이 붙인다.
name: platform

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-server

  api-server:
    build:
      context: ..
      dockerfile: api-server/Dockerfile
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT is required}
      # 관리 콘솔 출처(쉼표 구분). 운영 infra/.env에 Vercel 도메인을 넣는다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      QUARANTINE_S3_BUCKET: ${QUARANTINE_S3_BUCKET:?QUARANTINE_S3_BUCKET is required}
      QUARANTINE_S3_REGION: ${QUARANTINE_S3_REGION:?QUARANTINE_S3_REGION is required}
    networks: [default, engine-net]

  detection-engine:
    build:
      context: ..
      dockerfile: detection-engine/Dockerfile
    # 공격자가 만든 파일을 파싱하는 컨테이너다. 뚫려도 피해가 여기서 끝나야 한다.
    networks: [engine-net]
    read_only: true
    # 받은 파일은 /spool(디스크 볼륨)에 쓰고 분석 후 지운다. tmpfs는 메모리라서 큰 파일을 둘 수 없다.
    environment:
      ENGINE_SPOOL_DIR: /spool
    volumes:
      - engine-spool:/spool
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 1.0

  prometheus:
    image: prom/prometheus:v3.6.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [default, engine-net]

volumes:
  engine-spool:

networks:
  # 외부(인터넷·AWS·EC2 메타데이터)로 나가는 경로가 없는 네트워크. 탐지 엔진은 여기에만 붙는다.
  engine-net:
    internal: true
