# 운영(EC2)과 같은 구성. RDS는 관리형이라 여기 없다 — 로컬에서는 compose.dev.yml이 붙인다.
# Redis(블룸 필터)는 ElastiCache를 두기 전까지 이 파일의 컨테이너를 운영에서도 그대로 쓴다.
name: platform

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/locations.conf:/etc/nginx/locations.conf:ro
    depends_on:
      - api-server

  api-server:
    build:
      context: ..
      dockerfile: api-server/Dockerfile
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # 같은 compose의 redis 서비스가 기본값. ElastiCache로 옮기면 infra/.env에서 덮어쓴다.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # 관리 콘솔 출처(쉼표 구분). 운영 infra/.env에 Vercel 도메인을 넣는다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # 관리 API 인증. 운영은 켠 채로 둔다(값이 없어도 켜짐). 로컬 dev.env만 false다.
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # 관리자 access 토큰(JWT) 서명 키. 32바이트 이상. 운영 값은 infra/.env에만 둔다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # 비우면 application.yml 기본값(access 1h, refresh 7d)을 쓴다.
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-1h}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      # 첫 관리자 계정(선택). 둘 다 있고 그 계정명이 없을 때만 기동 시 만든다. 운영 값은 infra/.env에만 둔다.
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      QUARANTINE_S3_BUCKET: ${QUARANTINE_S3_BUCKET:?QUARANTINE_S3_BUCKET is required}
      QUARANTINE_S3_REGION: ${QUARANTINE_S3_REGION:?QUARANTINE_S3_REGION is required}
    depends_on:
      redis:
        condition: service_healthy
    networks: [default, engine-net]

  # 블룸 필터 저장소. 내용은 file_verdicts에서 주기적으로 다시 만들어지므로 영속 볼륨을 두지 않는다.
  # 포트를 열지 않는다 — api-server만 default 네트워크로 붙는다.
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  detection-engine:
    build:
      context: ..
      dockerfile: detection-engine/Dockerfile
    # 공격자가 만든 파일을 파싱하는 컨테이너다. 뚫려도 피해가 여기서 끝나야 한다.
    networks: [engine-net]
    read_only: true
    # 받은 파일은 /spool(디스크 볼륨)에 쓰고 분석 후 지운다. tmpfs는 메모리라서 큰 파일을 둘 수 없다.
    environment:
      ENGINE_SPOOL_DIR: /spool
    volumes:
      - engine-spool:/spool
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 1.0

  prometheus:
    image: prom/prometheus:v3.6.0
    # 볼륨이 없으면 배포·재시작 때마다 지표가 지워진다. 28일 SLO를 계산하려고 35일(28일 + 여유)을 보관한다.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [default, engine-net]

  # ---- 고도화 테스트 수집(설계 레포 docs/advancement 1-2). 호스트 포트는 열지 않고 Prometheus만 긁는다. ----
  node-exporter:
    # 호스트 CPU·메모리·디스크. 호스트 /를 읽기 전용으로 본다.
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro

  postgres-exporter:
    # 버퍼 캐시 적중률·쿼리별 시간(pg_stat_statements)·잠금. 계정은 api-server와 같다(읽기만 한다).
    image: prometheuscommunity/postgres-exporter:v0.17.1
    command: ["--collector.stat_statements"]
    environment:
      DATA_SOURCE_URI: postgres:5432/platform?sslmode=disable
      DATA_SOURCE_USER: ${DB_USERNAME:?DB_USERNAME is required}
      DATA_SOURCE_PASS: ${DB_PASSWORD:?DB_PASSWORD is required}

  redis-exporter:
    # 메모리·명령별 시간·쫓겨난 키
    image: oliver006/redis_exporter:v1.74.0
    environment:
      REDIS_ADDR: redis://redis:6379

  cadvisor:
    # 컨테이너별 CPU·메모리·OOM. 메모리 약 100~150MB라 EC2 여유(available)가 500MB 아래로 내려가면 뺀다.
    # v0.54.0부터 containerd 이미지 저장소(Docker 29 기본)를 읽는다. v0.52는 컨테이너를 식별하지 못했다.
    image: ghcr.io/google/cadvisor:v0.60.6
    command: ["--housekeeping_interval=30s", "--docker_only=true", "--store_container_labels=false"]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  engine-spool:
  prometheus-data:

networks:
  # 외부(인터넷·AWS·EC2 메타데이터)로 나가는 경로가 없는 네트워크. 탐지 엔진은 여기에만 붙는다.
  engine-net:
    internal: true
