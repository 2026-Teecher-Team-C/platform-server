# 로컬 개발용 덮어쓰기. 사용: make dev (레포 루트)
services:
  api-server:
    build: !reset null
    image: eclipse-temurin:21-jdk
    working_dir: /workspace/api-server
    command: ["./gradlew", "bootRun", "--no-daemon", "--project-cache-dir", "/tmp/gradle-project"]
    environment:
      # make test 와 빌드 출력·잠금이 겹치지 않도록 컨테이너 안에 둔다
      GRADLE_BUILD_DIR: /tmp/build
      # compose.yml은 QUARANTINE_S3_BUCKET/REGION만 요구한다 — LocalStack 전용 값들은 운영 compose.yml이
      # 모르는 설정이라 여기서만 직접 전달해야 실제로 컨테이너에 들어간다.
      QUARANTINE_S3_ENDPOINT: ${QUARANTINE_S3_ENDPOINT}
      QUARANTINE_S3_PATH_STYLE: ${QUARANTINE_S3_PATH_STYLE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ..:/workspace
      - gradle-cache:/root/.gradle
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  detection-engine:
    volumes:
      - ../detection-engine/src/detection_engine:/app/src/detection_engine:ro
      - ../detection-engine/rules:/app/rules:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 이미지·헬스체크는 compose.yml에 있다. 로컬에서는 호스트에서도 붙을 수 있게 포트만 연다.
  redis:
    ports:
      - "6379:6379"

  # 로컬 개발용 S3 호환 스토리지. 운영은 실제 S3(ElastiCache/RDS와 같은 관리형 자원).
  # MinIO는 2026-09에 Docker Hub/quay.io에서 커뮤니티 에디션 이미지를 내려서 pull이 안 된다 —
  # LocalStack(S3 에뮬레이터)으로 대체. 자격증명은 아무 문자열이나 받아준다(커뮤니티 에디션은 검증 안 함).
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  console:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ../console:/app
      - console-node-modules:/app/node_modules
    ports:
      - "5173:5173"

  prometheus:
    ports:
      - "9091:9090"

volumes:
  gradle-cache:
  postgres-data:
  console-node-modules:
