spring:
  application:
    name: api-server
  autoconfigure:
    # 관리자는 admin_users로만 로그인한다. Boot가 만드는 메모리 사용자("user" + 로그에 찍히는 임시 비밀번호)를 끈다.
    # gRPC OAuth2 리소스 서버 설정도 쓰지 않는다(에이전트는 AgentAuthServerInterceptor로 인증). OAuth2 클래스가 없어
    # 기동할 때마다 조건 검사 경고가 찍히던 것을 없앤다.
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerOAuth2ResourceServerAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${DB_USERNAME:platform}
    # 기본값을 두지 않는다 — DB_PASSWORD가 없으면 그냥 기동 실패해야 한다(커밋된 파일에 비밀번호
    # 형태의 기본값을 남기지 않기 위함). 로컬은 infra/dev.env가 항상 채워준다.
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 소유한다. 엔티티는 검증만 한다.
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      # 룰셋(.yar) 업로드 상한. 아래 ruleset.* 값을 따른다(상한을 바꿀 때는 ruleset.*만 고친다).
      max-file-size: ${ruleset.max-source-bytes}B
      max-request-size: ${ruleset.max-request-bytes}B
  grpc:
    client:
      channel:
        detection-engine:
          # 격리된 engine-net 네트워크 안이라 TLS 불필요. docker compose 서비스명으로 해석된다.
          target: static://${ENGINE_ADDRESS:detection-engine:50051}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Tomcat은 거절한 요청 본문을 기본 2MB까지만 읽고 연결을 끊는다. 그러면 32MiB 근처 업로드를 거절할 때
# 클라이언트가 400 대신 연결 끊김을 받는다. multipart 요청 상한까지는 읽고 400을 돌려준다.
server:
  tomcat:
    max-swallow-size: ${ruleset.max-request-bytes}B

ruleset:
  # 룰셋 원문 상한(바이트). 기본 32MiB(YARA Forge full 약 19MB). multipart 파일 한도와 크기 초과 문구가 이 값을 따른다.
  # 바꿀 때 함께 맞출 것: 엔진 ENGINE_MAX_RULES_BYTES, nginx /api/admin/rulesets client_max_body_size, 콘솔 MAX_RULESET_BYTES.
  max-source-bytes: 33554432
  # multipart 요청 전체 한도(원문 + 여유 1MiB). multipart 요청 한도와 Tomcat max-swallow-size가 이 값을 따른다.
  max-request-bytes: 34603008
  # 엔진 CompileRules/LoadRuleset 호출 시간 제한. 큰 룰셋은 1CPU에서 컴파일에 수 초 걸린다(full 약 4초).
  engine-timeout: 60s

lookup:
  bloom-filter:
    # n: 블룸이 추적할 것으로 예상하는 file_verdicts 전체 해시 수. 실제 개수가 이 값을 크게 넘으면
    # 오탐률이 설정값보다 서서히 나빠진다(이번 스프린트 범위 밖 — 동적 재계산 없음).
    expected-hash-count: 100000
    # p: 목표 오탐률. m/k는 이 둘로부터 계산한다(RedisBloomFilterPortImpl 참고).
    false-positive-rate: 0.01
    rebuild-interval-ms: 300000

platform:
  auth:
    # 기본은 켬. 끄면(로컬 개발 전용, infra/dev.env) 관리 API가 로그인 없이 열리고 모든 요청이 초기 관리자로
    # 처리된다. 운영에서는 끄지 않는다 — 값이 없으면 켜진 채로 뜬다.
    enabled: ${AUTH_ENABLED:true}
    jwt:
      # access 토큰(JWT, HS256) 서명 키. 32바이트 이상. 기본값이 없어서 비어 있으면 기동하지 않는다(JwtConfig).
      secret: ${JWT_SECRET:}
      # access는 짧게, refresh(Redis 저장, 쓸 때마다 새로 발급)는 길게 둔다.
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  cors:
    # 쉼표로 구분. 운영은 Vercel 콘솔 도메인을 CORS_ALLOWED_ORIGINS로 넣는다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    bootstrap:
      # 둘 다 있고 같은 계정명이 없을 때만 기동 시 ADMIN 계정을 만든다(AdminBootstrap). 비우면 아무것도 안 한다.
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}

quarantine:
  s3:
    bucket: ${QUARANTINE_S3_BUCKET:platform-quarantine}
    region: ${QUARANTINE_S3_REGION:us-east-1}
    # 비어있으면 실제 AWS 엔드포인트 사용(운영). 로컬은 LocalStack을 가리킨다.
    endpoint-override: ${QUARANTINE_S3_ENDPOINT:}
    # LocalStack은 path-style 접근이 필요하다(virtual-hosted-style 기본은 AWS 실제 S3 기준).
    path-style-access: ${QUARANTINE_S3_PATH_STYLE:false}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    # CheckHash 지연 p95/p99(고도화 테스트 1-1). SLO 경계는 100ms(목록·캐시 경로)와 1s(TLSH 비교 목표).
    distribution:
      percentiles-histogram:
        verdict.checkhash: true
        verdict.checkhash.stage: true
      slo:
        verdict.checkhash: 100ms, 1s
        verdict.checkhash.stage: 100ms, 1s

logging:
  pattern:
    # CheckHash·SubmitFile 요청 동안 MDC의 event_id를 찍는다(측정 결과와 로그를 이어 붙이기, 고도화 테스트 1-1).
    # 요청 밖에서는 빈 괄호가 남지 않게 지운다.
    correlation: "%replace([event_id=%X{event_id}] ){'\\[event_id=\\] ', ''}"

similarity:
  corpus:
    # TLSH 비교 대상 상한(고도화 테스트 시나리오 B 규모별 곡선). 0이면 무제한(운영 기본값).
    limit: ${SIMILARITY_CORPUS_LIMIT:0}
  # memory: 메모리 스냅샷(활성 악성 지문 전체, 117만 건 ≈ 80MB)의 L ±5 묶음만 비교. 스냅샷이 지금 corpus와 다르면 indexed로 답한다.
  # indexed: 입력 TLSH의 L-value ±5 후보만 DB에서 비교(V19, 결론은 전체 비교와 같다). bruteforce: 전체 비교(동일성 검사·되돌리기용).
  mode: ${SIMILARITY_MODE:memory}
