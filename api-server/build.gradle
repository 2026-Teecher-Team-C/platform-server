plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.6'
}

group = 'com.teecherteamc'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':tlsh')
    // S3 격리 업로드. Spring Boot BOM이 버전을 안 맞춰줘서 AWS SDK 자체 BOM을 따로 둔다.
    implementation platform('software.amazon.awssdk:bom:2.25.11')
    implementation 'software.amazon.awssdk:s3'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-client'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
    // gRPC 표준 헬스 체크(grpc.health.v1). gRPC 서비스 빈이 하나라도 생기면 자동으로 함께 노출된다.
    implementation 'io.grpc:grpc-services'
    // 블룸 필터 비트맵 저장용. Lettuce가 기본 클라이언트로 같이 들어온다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 관리 콘솔 로그인. gRPC(9090)는 서블릿 필터 체인을 타지 않으므로 영향이 없다.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 관리자 access 토큰(JWT) 발급·검증. 외부 인증 서버 없이 HS256 비밀키로 직접 서명한다.
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-grpc-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-grpc-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // TestRestTemplate이 Boot 4.1에서 spring-boot-test-autoconfigure가 아니라 이 모듈로 옮겨짐
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    // TestRestTemplate 자동구성이 RestTemplateBuilder(이 모듈 소속)를 필요로 함
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// make dev 의 bootRun 과 make test 가 같은 소스 폴더를 쓴다. 개발 컨테이너는 출력 폴더를 따로 둔다.
if (System.getenv('GRADLE_BUILD_DIR')) {
    layout.buildDirectory = file(System.getenv('GRADLE_BUILD_DIR'))
}

// gRPC 계약의 원본은 레포 루트의 proto/ 다. 여기로 복사하지 않는다.
sourceSets {
    main {
        proto {
            srcDir '../proto'
        }
    }
}

// protoc·grpc 플러그인 버전은 Spring Boot가 맞춰준다. grpc 블록을 선언해야 서비스 스텁이 생성된다.
protobuf {
    plugins {
        grpc {}
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// JMH 마이크로벤치마크. 빌드·테스트에 포함되지 않고 `make bench-tlsh`로만 돈다.
// Gradle 플러그인 대신 소스셋과 JavaExec로 둔다(Gradle 버전 업그레이드에 플러그인 호환성이 걸리지 않게).
sourceSets {
    jmh {
        java.srcDir 'src/jmh/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    jmhImplementation.extendsFrom implementation
    jmhRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.register('jmh', JavaExec) {
    description = 'JMH 벤치마크 실행. 인자는 -PjmhArgs="..." (예: -PjmhArgs="-p corpusSize=1000")'
    group = 'benchmark'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    args((project.findProperty('jmhArgs') ?: '').toString().tokenize())
}
